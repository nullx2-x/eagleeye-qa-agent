      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const byId = (suffix) =>
            document.getElementById(`02-introducing-eagleeye-${suffix}`);
          const tl = gsap.timeline({ paused: true });

          const headline = byId("scene-one-headline");
          const centerNode = byId("center-node");
          const assemblyShell = byId("assembly-shell");
          const depthBack = byId("depth-back");
          const depthMiddle = byId("depth-middle");
          const wordmarkWrap = byId("wordmark-wrap");
          const wordmark = byId("wordmark");
          const morphCard = byId("morph-card");
          const morphOld = byId("morph-old");
          const dashboard = byId("dashboard");
          const sceneThreeCopy = byId("scene-three-copy");
          const finalLockup = byId("final-lockup");
          const finalHeadline = byId("final-headline");

          const rays = [1, 2, 3, 4, 5].map((index) => byId(`ray-${index}`));
          rays.forEach((ray) => {
            const length = ray.getTotalLength();
            ray.style.strokeDasharray = `${length}`;
            ray.style.strokeDashoffset = `${length}`;
          });

          tl.fromTo(
            headline,
            { y: 26, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.48,
              ease: "power2.out",
              immediateRender: true,
            },
            0,
          );

          rays.forEach((ray, index) => {
            const length = ray.getTotalLength();
            tl.fromTo(
              ray,
              { strokeDashoffset: length, opacity: 0.3 },
              {
                strokeDashoffset: 0,
                opacity: 1,
                duration: 1.45,
                ease: "power2.out",
                immediateRender: true,
              },
              0.28 + index * 0.3,
            );
          });

          tl.fromTo(
            centerNode,
            { opacity: 0 },
            {
              opacity: 1,
              duration: 0.3,
              ease: "power1.out",
              immediateRender: true,
            },
            2.42,
          );

          // Scene 1 → Scene 2: leftward cut-the-curve, matched on both sides.
          tl.to(headline, { x: -230, duration: 0.34, ease: "power4.in" }, 2.98);
          tl.to(headline, { opacity: 0, duration: 0.28, ease: "power1.in" }, 3.02);
          tl.to(rays, { opacity: 0.16, duration: 0.3, ease: "power1.out" }, 3.0);
          tl.fromTo(
            assemblyShell,
            { x: 230, opacity: 0 },
            {
              x: 0,
              opacity: 1,
              duration: 0.36,
              ease: "power4.out",
              immediateRender: true,
            },
            3.18,
          );

          // Three visual depths: ray field, paper planes, then pills + wordmark.
          tl.fromTo(
            depthBack,
            { scale: 0.9, opacity: 0 },
            {
              scale: 1,
              opacity: 0.58,
              duration: 0.78,
              ease: "power3.out",
              immediateRender: true,
            },
            3.28,
          );
          tl.fromTo(
            depthMiddle,
            { scale: 0.94, opacity: 0 },
            {
              scale: 1,
              opacity: 0.92,
              duration: 0.72,
              ease: "power3.out",
              immediateRender: true,
            },
            3.44,
          );

          const pills = Array.from(
            document.querySelectorAll('[class~="02-introducing-eagleeye-pill"]'),
          );
          pills.forEach((pill, index) => {
            const startX = Number(pill.dataset.assemblyStartX);
            const startY = Number(pill.dataset.assemblyStartY);
            const endX = Number(pill.dataset.assemblyEndX);
            const endY = Number(pill.dataset.assemblyEndY);
            tl.fromTo(
              pill,
              {
                xPercent: -50,
                yPercent: -50,
                x: startX,
                y: startY,
                scale: 0.72,
                opacity: 0,
              },
              {
                xPercent: -50,
                yPercent: -50,
                x: endX,
                y: endY,
                scale: 1,
                opacity: 1,
                duration: 1.15,
                ease: "power3.inOut",
                immediateRender: true,
              },
              3.32 + index * 0.62,
            );
          });

          tl.fromTo(
            wordmarkWrap,
            { y: 22, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.42,
              ease: "power2.out",
              immediateRender: true,
            },
            4.92,
          );

          const lockupStates = [
            { t: 0, text: "" },
            { t: 0.25, text: "E" },
            { t: 0.65, text: "Ea" },
            { t: 1.05, text: "Eagl" },
            { t: 1.45, text: "Eagle" },
            { t: 1.9, text: "EagleE" },
            { t: 2.25, text: "EagleEye" },
          ];
          const lockupTextAt = (time) => {
            for (let index = lockupStates.length - 1; index >= 0; index -= 1) {
              if (time >= lockupStates[index].t) return lockupStates[index].text;
            }
            return "";
          };
          const lockupDriver = { t: 0 };
          tl.to(
            lockupDriver,
            {
              t: 2.4,
              duration: 2.4,
              ease: "none",
              onUpdate: () => {
                wordmark.textContent = lockupTextAt(lockupDriver.t);
              },
            },
            5.0,
          );

          // Scene 3: the centered lockup becomes the real dashboard card.
          tl.fromTo(
            morphCard,
            { scale: 0.94, opacity: 0 },
            {
              scale: 1,
              opacity: 1,
              duration: 0.55,
              ease: "power2.out",
              immediateRender: true,
            },
            7.48,
          );
          tl.to(
            morphCard,
            {
              width: 1306,
              height: 620,
              borderRadius: 12,
              backgroundColor: "#151817",
              duration: 1.0,
              ease: "power2.inOut",
            },
            8.2,
          );
          tl.to(morphOld, { opacity: 0, duration: 0.4, ease: "power1.in" }, 8.2);
          tl.to(
            assemblyShell,
            { scale: 0.97, opacity: 0, duration: 0.42, ease: "power1.in" },
            8.2,
          );
          tl.to(rays, { opacity: 0, duration: 0.3, ease: "power1.in" }, 8.2);
          tl.fromTo(
            dashboard,
            { scale: 1.025, opacity: 0 },
            {
              scale: 1,
              opacity: 1,
              duration: 0.48,
              ease: "power1.out",
              immediateRender: true,
            },
            8.72,
          );
          tl.fromTo(
            sceneThreeCopy,
            { y: 20, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.48,
              ease: "power2.out",
              immediateRender: true,
            },
            9.0,
          );

          // Scene 3 → Scene 4: another matched leftward cut, then a dead-static hold.
          tl.to(
            sceneThreeCopy,
            { x: -230, duration: 0.34, ease: "power4.in" },
            10.54,
          );
          tl.to(
            sceneThreeCopy,
            { opacity: 0, duration: 0.28, ease: "power1.in" },
            10.58,
          );
          tl.fromTo(
            finalHeadline,
            { x: 230, opacity: 0 },
            {
              x: 0,
              opacity: 1,
              duration: 0.34,
              ease: "power4.out",
              immediateRender: true,
            },
            10.8,
          );
          tl.fromTo(
            finalLockup,
            { x: 230, opacity: 0 },
            {
              x: 0,
              opacity: 1,
              duration: 0.34,
              ease: "power4.out",
              immediateRender: true,
            },
            10.86,
          );

          window.__timelines["02-introducing-eagleeye"] = tl;
        })();
      </script>
