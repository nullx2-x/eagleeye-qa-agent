      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          window.__timelines = window.__timelines || {};

          const byId = (id) => document.getElementById(id);
          const cards = [
            byId("10-outro-card-observe"),
            byId("10-outro-card-generate"),
            byId("10-outro-card-explain"),
          ];
          const cardMedia = [
            byId("10-outro-card-observe-image"),
            byId("10-outro-card-generate-image"),
            byId("10-outro-card-explain-image"),
          ];
          const labels = [
            byId("10-outro-label-observe"),
            byId("10-outro-label-generate"),
            byId("10-outro-label-explain"),
          ];
          const connectorPaths = [
            byId("10-outro-connector-observe"),
            byId("10-outro-connector-generate"),
            byId("10-outro-connector-explain"),
          ];
          const connectors = byId("10-outro-connectors");
          const hub = byId("10-outro-hub");
          const dashboardGhost = byId("10-outro-dashboard-ghost");
          const dashboardPanel = byId("10-outro-dashboard-panel");
          const lockup = byId("10-outro-lockup");
          const spike = byId("10-outro-spike");
          const wordmark = byId("10-outro-wordmark");
          const category = byId("10-outro-category");
          const frameLine = byId("10-outro-frame-line");
          const index = byId("10-outro-index");
          const valueWords = [
            byId("10-outro-value-observe"),
            byId("10-outro-value-generate"),
            byId("10-outro-value-replay"),
          ];

          connectorPaths.forEach((path) => {
            const length = path.getTotalLength();
            path.style.strokeDasharray = String(length);
            path.style.strokeDashoffset = String(length);
          });

          wordmark.textContent = "";

          const tl = gsap.timeline({ paused: true });

          const phraseContent = [
            {
              text: "Observe reality.",
              hold: 0.55,
              speedFactor: 1,
              words: [
                byId("10-outro-phrase-observe-word-1"),
                byId("10-outro-phrase-observe-word-2"),
              ],
            },
            {
              text: "Generate coverage.",
              hold: 0.55,
              speedFactor: 1,
              words: [
                byId("10-outro-phrase-generate-word-1"),
                byId("10-outro-phrase-generate-word-2"),
              ],
            },
            {
              text: "Replay proof.",
              hold: 0.85,
              speedFactor: 1,
              words: [
                byId("10-outro-phrase-replay-word-1"),
                byId("10-outro-phrase-replay-word-2"),
              ],
            },
          ];
          const allPhraseWords = phraseContent.flatMap((entry) => entry.words);

          tl.set(allPhraseWords, { opacity: 0, x: 230 }, 0);
          tl.set(valueWords, { opacity: 0, x: 230 }, 0);

          tl.fromTo(
            cards[0],
            { opacity: 0, x: -46, y: 28, scale: 0.96 },
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              duration: 0.78,
              ease: "power3.out",
              immediateRender: true,
            },
            0.14,
          );
          tl.fromTo(
            labels[0],
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: true },
            0.82,
          );
          tl.fromTo(
            cards[1],
            { opacity: 0, x: 0, y: -42, scale: 0.96 },
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              duration: 0.78,
              ease: "power3.out",
              immediateRender: true,
            },
            1.34,
          );
          tl.fromTo(
            labels[1],
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: true },
            2.02,
          );
          tl.fromTo(
            cards[2],
            { opacity: 0, x: 46, y: 28, scale: 0.96 },
            {
              opacity: 1,
              x: 0,
              y: 0,
              scale: 1,
              duration: 0.78,
              ease: "power3.out",
              immediateRender: true,
            },
            2.54,
          );
          tl.fromTo(
            labels[2],
            { opacity: 0, y: 18 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: true },
            3.22,
          );
          tl.to(dashboardGhost, { opacity: 0.11, duration: 0.8, ease: "power1.out" }, 4.0);
          tl.fromTo(
            hub,
            { opacity: 0, scale: 0.72 },
            { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out", immediateRender: true },
            4.12,
          );

          connectorPaths.forEach((path, index) => {
            tl.to(
              path,
              { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" },
              5.0 + index * 0.36,
            );
          });

          const PHRASE_START = 5.0;
          const PHRASE_DURATION = 5.8;
          const BASE_DURATION = 0.65;
          const SEC_PER_CHAR = 0.035;
          const rawDurations = phraseContent.map(
            (entry) =>
              (BASE_DURATION + entry.text.length * SEC_PER_CHAR + entry.hold) / entry.speedFactor,
          );
          const rawTotal = rawDurations.reduce((sum, duration) => sum + duration, 0);
          const phraseScale = PHRASE_DURATION / rawTotal;
          let phraseCursor = PHRASE_START;
          const phraseTimeline = phraseContent.map((entry, index) => {
            const duration = rawDurations[index] * phraseScale;
            const start = phraseCursor;
            phraseCursor += duration;
            return { ...entry, start, end: phraseCursor };
          });

          phraseTimeline.forEach((entry, entryIndex) => {
            let entryGap = 0;
            entry.words.forEach((word, wordIndex) => {
              if (wordIndex > 0) entryGap += 0.05 * Math.pow(0.84, wordIndex - 1);
              const firstLine = entryIndex === 0;
              tl.fromTo(
                word,
                { opacity: firstLine ? 0 : 0.35, x: firstLine ? 80 : 230 },
                {
                  opacity: 1,
                  x: 0,
                  duration: firstLine ? 0.46 : 0.3,
                  ease: firstLine ? "power3.out" : "power4.out",
                  immediateRender: false,
                },
                entry.start + entryGap,
              );
            });

            entry.words.forEach((word, wordIndex) => {
              const readingOrderLead = (entry.words.length - 1 - wordIndex) * 0.022;
              tl.to(
                word,
                { x: -230, duration: 0.34, ease: "power4.in" },
                entry.end - 0.34 - readingOrderLead,
              );
              tl.to(
                word,
                { opacity: 0, duration: 0.18, ease: "power1.in" },
                entry.end - 0.18 - readingOrderLead,
              );
            });
          });

          const MORPH_START = 10.8;
          const MORPH_DURATION = 2.15;
          const convergeX = [620, 0, -620];

          cards.forEach((card, index) => {
            tl.to(
              card,
              {
                x: convergeX[index],
                y: 87,
                scale: 0.22,
                duration: MORPH_DURATION,
                ease: "power2.inOut",
              },
              MORPH_START,
            );
          });
          tl.to(cardMedia, { opacity: 0, duration: 0.86, ease: "power1.in" }, MORPH_START);
          tl.to(labels, { opacity: 0, y: -12, duration: 0.56, ease: "power1.in" }, MORPH_START);
          tl.to(connectors, { opacity: 0, duration: 0.64, ease: "power1.in" }, MORPH_START);
          tl.to(hub, { opacity: 0, scale: 0.8, duration: 0.42, ease: "power1.in" }, MORPH_START + 0.1);
          tl.to(dashboardGhost, { opacity: 0, duration: 0.62, ease: "power1.in" }, MORPH_START);
          tl.to(cards, { opacity: 0, duration: 0.78, ease: "power1.in" }, MORPH_START + 1.28);
          tl.fromTo(
            dashboardPanel,
            { opacity: 0, x: 90, scale: 0.9 },
            {
              opacity: 1,
              x: 0,
              scale: 1,
              duration: 1.3,
              ease: "power2.out",
              immediateRender: true,
            },
            MORPH_START + 1.15,
          );

          const WORDMARK_DURATION = 3.25;
          const wordmarkStates = [
            { t: 0, text: "" },
            { t: 0.22, text: "E" },
            { t: 0.62, text: "Eag" },
            { t: 1.05, text: "Eagle" },
            { t: 1.55, text: "EagleE" },
            { t: 2.15, text: "EagleEye" },
          ];
          const wordmarkAt = (time) => {
            for (let index = wordmarkStates.length - 1; index >= 0; index -= 1) {
              if (time >= wordmarkStates[index].t) return wordmarkStates[index].text;
            }
            return "";
          };
          const wordmarkDriver = { t: 0 };

          tl.fromTo(
            lockup,
            { opacity: 0, y: 22 },
            { opacity: 1, y: 0, duration: 0.52, ease: "power2.out", immediateRender: true },
            13.1,
          );
          tl.to(
            wordmarkDriver,
            {
              t: WORDMARK_DURATION,
              duration: WORDMARK_DURATION,
              ease: "none",
              onUpdate: () => {
                wordmark.textContent = wordmarkAt(wordmarkDriver.t);
              },
            },
            13.2,
          );

          tl.fromTo(
            category,
            { opacity: 0, y: 24 },
            { opacity: 1, y: 0, duration: 0.75, ease: "power2.out", immediateRender: true },
            16.8,
          );
          tl.fromTo(
            spike,
            { opacity: 0, scale: 0.92 },
            { opacity: 1, scale: 1, duration: 0.65, ease: "power2.out", immediateRender: true },
            17.15,
          );

          tl.to(
            [dashboardPanel, frameLine, index],
            { opacity: 0, duration: 1.2, ease: "power1.inOut" },
            22.0,
          );
          tl.to(category, { x: -230, duration: 0.34, ease: "power4.in" }, 22.0);
          tl.to(category, { opacity: 0, duration: 0.3, ease: "power1.in" }, 22.04);

          let valueGap = 0;
          valueWords.forEach((word, index) => {
            if (index > 0) valueGap += 0.05 * Math.pow(0.84, index - 1);
            tl.fromTo(
              word,
              { opacity: 0.35, x: 230 },
              {
                opacity: 1,
                x: 0,
                duration: 0.42,
                ease: "power4.out",
                immediateRender: false,
              },
              22.34 + valueGap,
            );
          });

          window.__timelines["10-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
