      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};

        const compositionRoot = document.querySelector(
          '[data-composition-id="05-openai-generation"]',
        );
        const byId = (suffix) =>
          document.getElementById(`05-openai-generation-${suffix}`);

        const cameraWorld = byId("camera-world");
        const ringStage = byId("ring-stage");
        const ringProgress = byId("ring-progress");
        const recordedValue = byId("recorded-value");
        const ringNote = byId("ring-note");
        const sourceCard = byId("source-card");
        const evidenceRule = byId("evidence-rule");
        const immutableTag = byId("immutable-tag");
        const replayCard = byId("replay-card");
        const providerInstrument = byId("provider-instrument");
        const focusRail = byId("focus-rail");
        const providerLanded = byId("provider-landed");
        const zoomOuter = byId("zoom-outer");
        const zoomInner = byId("zoom-inner");
        const sceneThreeStage = byId("scene-three-stage");
        const testlistCard = byId("testlist-card");
        const caseMeter = byId("case-meter");
        const caseCount = byId("case-count");
        const generatedDelta = byId("generated-delta");
        const qualityStage = byId("quality-stage");
        const qualityRule = byId("quality-rule");
        const qualityPass = byId("quality-pass");

        const providerRows = Array.from(
          compositionRoot.querySelectorAll(
            '[class~="05-openai-generation-provider-row"]',
          ),
        );
        const rowMasks = Array.from(
          compositionRoot.querySelectorAll(
            '[class~="05-openai-generation-row-mask"]',
          ),
        );
        const caseBars = Array.from(
          compositionRoot.querySelectorAll(
            '[class~="05-openai-generation-case-bar"]:not([data-recorded="true"])',
          ),
        );

        const ringLength = ringProgress.getTotalLength();
        ringProgress.style.strokeDasharray = `${ringLength}`;
        ringProgress.style.strokeDashoffset = `${ringLength}`;

        const camera = { x: 0, y: 0, scale: 1 };
        const applyCamera = () => {
          cameraWorld.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
        };
        applyCamera();

        const recordedState = { value: 0 };
        const caseState = { value: 1 };
        const tl = gsap.timeline({ paused: true });

        tl.set(
          [sourceCard, immutableTag, replayCard, providerInstrument, providerLanded, sceneThreeStage],
          { opacity: 0 },
          0,
        );
        tl.set(providerRows, { opacity: 0, x: 42 }, 0);
        tl.set(focusRail, { scaleY: 0, transformOrigin: "center top" }, 0);
        tl.set(evidenceRule, { scaleX: 0, transformOrigin: "left center" }, 0);
        tl.set(rowMasks, { scaleX: 1, transformOrigin: "right center" }, 0);
        tl.set(caseBars, { scaleY: 0, transformOrigin: "bottom center" }, 0);
        tl.set(generatedDelta, { opacity: 0, y: 16 }, 0);
        tl.set(qualityStage, { opacity: 0, scale: 0.72 }, 0);
        tl.set(qualityRule, { scaleX: 0, transformOrigin: "center center" }, 0);
        tl.set(qualityPass, { opacity: 0, y: 14 }, 0);

        tl.fromTo(
          ringStage,
          { opacity: 0, y: 24, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.48, ease: "power3.out" },
          0.02,
        );
        tl.to(
          recordedState,
          {
            value: 1,
            duration: 2.9,
            ease: "power3.out",
            onUpdate: () => {
              recordedValue.textContent = String(Math.round(recordedState.value));
            },
          },
          0.15,
        );
        tl.fromTo(
          recordedValue,
          { scale: 0.52 },
          { scale: 1, duration: 2.9, ease: "power3.out" },
          0.15,
        );
        tl.to(
          ringProgress,
          { strokeDashoffset: 0, duration: 2.9, ease: "power3.out" },
          0.15,
        );
        tl.fromTo(
          sourceCard,
          { opacity: 0, x: 110 },
          { opacity: 1, x: 0, duration: 0.76, ease: "power4.out" },
          0.92,
        );
        tl.to(
          evidenceRule,
          { scaleX: 1, duration: 1.15, ease: "power3.out" },
          1.82,
        );
        tl.fromTo(
          ringNote,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
          2.72,
        );
        tl.fromTo(
          immutableTag,
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.52, ease: "power2.out" },
          3.34,
        );
        tl.to(
          camera,
          { scale: 1.025, duration: 4.1, ease: "none", onUpdate: applyCamera },
          0.1,
        );

        tl.to(
          camera,
          {
            x: -1920,
            scale: 1,
            duration: 0.82,
            ease: "power4.inOut",
            onUpdate: applyCamera,
          },
          4.58,
        );
        tl.fromTo(
          replayCard,
          { opacity: 0, x: 96 },
          { opacity: 1, x: 0, duration: 0.7, ease: "power4.out" },
          4.74,
        );
        tl.fromTo(
          providerInstrument,
          { opacity: 0, x: 118 },
          { opacity: 1, x: 0, duration: 0.78, ease: "power4.out" },
          4.94,
        );
        tl.to(
          focusRail,
          { scaleY: 1, duration: 0.72, ease: "power3.out" },
          5.02,
        );
        providerRows.forEach((row, index) => {
          tl.fromTo(
            row,
            { opacity: 0, x: 42 },
            { opacity: 1, x: 0, duration: 0.56, ease: "power3.out" },
            5.48 + index * 0.94,
          );
        });
        tl.to(
          camera,
          {
            x: -2040,
            scale: 1.03,
            duration: 0.85,
            ease: "power2.inOut",
            onUpdate: applyCamera,
          },
          7.82,
        );
        tl.fromTo(
          providerLanded,
          { opacity: 0, y: 20, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.68, ease: "power3.out" },
          8.32,
        );

        tl.to(
          camera,
          {
            x: -3840,
            scale: 1,
            duration: 0.76,
            ease: "power4.inOut",
            onUpdate: applyCamera,
          },
          9.4,
        );
        tl.fromTo(
          sceneThreeStage,
          { opacity: 0, x: 96, scale: 1 },
          { opacity: 1, x: 0, scale: 1, duration: 0.62, ease: "power4.out" },
          9.5,
        );
        tl.fromTo(
          zoomOuter,
          { scale: 1 },
          { scale: 1.18, duration: 1.25, ease: "power3.inOut" },
          9.9,
        );
        tl.fromTo(
          zoomInner,
          { x: 0, y: 0 },
          { x: 250, y: -41, duration: 1.25, ease: "power3.inOut" },
          9.9,
        );
        tl.to(
          caseState,
          {
            value: 5,
            duration: 2.28,
            ease: "power3.out",
            onUpdate: () => {
              caseCount.textContent = String(Math.round(caseState.value));
            },
          },
          10.24,
        );
        tl.fromTo(
          caseCount,
          { scale: 0.62 },
          { scale: 1, duration: 2.28, ease: "power3.out" },
          10.24,
        );
        rowMasks.forEach((mask, index) => {
          const revealAt = 10.84 + index * 0.5;
          tl.to(
            mask,
            { scaleX: 0, duration: 0.46, ease: "power3.out" },
            revealAt,
          );
          tl.to(
            caseBars[index],
            { scaleY: 1, duration: 0.46, ease: "power3.out" },
            revealAt,
          );
        });
        tl.fromTo(
          generatedDelta,
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.56, ease: "power3.out" },
          12.16,
        );

        tl.to(
          sceneThreeStage,
          { scale: 0.72, opacity: 0.24, duration: 0.42, ease: "power2.in" },
          13.2,
        );
        tl.to(
          [testlistCard, caseMeter],
          {
            "--dof": "6px",
            opacity: 0.42,
            duration: 0.42,
            ease: "power2.inOut",
          },
          13.2,
        );
        tl.fromTo(
          qualityStage,
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.66, ease: "back.out(1.35)" },
          13.42,
        );
        tl.to(
          qualityRule,
          { scaleX: 1, duration: 0.55, ease: "power3.out" },
          13.8,
        );
        tl.fromTo(
          qualityPass,
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          14.15,
        );

        window.__timelines["05-openai-generation"] = tl;
      </script>
