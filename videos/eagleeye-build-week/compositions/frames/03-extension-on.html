<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template id="03-extension-on-template">
      <style>
        #root {
          position: relative;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          container-type: size;
          color: #081019;
          user-select: none;
        }

        #root,
        #root * {
          box-sizing: border-box;
        }

        [class~="03-extension-on-ground"] {
          position: absolute;
          inset: 0;
          z-index: 0;
          overflow: hidden;
          background-color: #eff8f8;
        }

        [class~="03-extension-on-ground"]::before {
          position: absolute;
          top: 0;
          left: 0;
          width: 690px;
          height: 900px;
          content: "";
          background-color: rgba(226, 231, 235, 0.54);
        }

        [class~="03-extension-on-ground"]::after {
          position: absolute;
          top: 0;
          left: 690px;
          width: 1px;
          height: 900px;
          content: "";
          background-color: rgba(8, 16, 25, 0.12);
        }

        [class~="03-extension-on-shot"] {
          position: absolute;
          inset: 0;
          z-index: 1;
          width: 100%;
          height: 100%;
          overflow: hidden;
          pointer-events: none;
        }

        [class~="03-extension-on-camera-outer"] {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 900px;
          overflow: hidden;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        [class~="03-extension-on-camera-inner"] {
          position: absolute;
          top: 0;
          left: 0;
          width: 1920px;
          height: 900px;
          will-change: transform;
        }

        [class~="03-extension-on-rail"] {
          position: absolute;
          top: 104px;
          left: 54px;
          z-index: 1;
          width: 1812px;
          height: 700px;
          overflow: hidden;
          background-color: rgba(226, 231, 235, 0.74);
          border: 1px solid rgba(8, 16, 25, 0.12);
          border-radius: 12px;
          box-shadow: 0 1px 3px rgba(8, 16, 25, 0.08), 0 4px 16px rgba(8, 16, 25, 0.04);
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-rail"]::before {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 770px;
          width: 1px;
          content: "";
          background-color: rgba(8, 16, 25, 0.12);
        }

        [class~="03-extension-on-panel"] {
          position: absolute;
          top: 132px;
          z-index: 2;
          height: 640px;
          overflow: hidden;
          border: 1px solid rgba(8, 16, 25, 0.2);
          border-radius: 12px;
          box-shadow: 0 1px 3px rgba(8, 16, 25, 0.08), 0 4px 16px rgba(8, 16, 25, 0.04);
          will-change: transform, opacity;
        }

        [class~="03-extension-on-panel-left"] {
          left: 80px;
          width: 728px;
          background-color: #151817;
        }

        [class~="03-extension-on-panel-right"] {
          left: 844px;
          width: 996px;
          background-color: #eff8f8;
        }

        [class~="03-extension-on-chrome"] {
          display: flex;
          width: 100%;
          height: 48px;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          border-bottom: 1px solid rgba(8, 16, 25, 0.12);
          font-family: monospace;
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 0.12em;
          line-height: 1;
          text-transform: uppercase;
        }

        [class~="03-extension-on-chrome-dark"] {
          color: #eff8f8;
          background-color: #202524;
          border-bottom-color: rgba(239, 248, 248, 0.14);
        }

        [class~="03-extension-on-chrome-light"] {
          color: #081019;
          background-color: #e2e7eb;
        }

        [class~="03-extension-on-chrome-index"] {
          color: #98abb8;
          font-size: 15px;
          letter-spacing: 0.04em;
        }

        [class~="03-extension-on-extension-window"] {
          position: relative;
          width: 100%;
          height: 350px;
          overflow: hidden;
          background-color: #151817;
        }

        [class~="03-extension-on-extension-image"] {
          position: absolute;
          top: 0;
          left: 0;
          width: 1500px;
          max-width: none;
          height: auto;
        }

        [class~="03-extension-on-recording-ring"] {
          position: absolute;
          top: 24px;
          left: 336px;
          width: 78px;
          height: 43px;
          border: 1px solid #34d6b4;
          border-radius: 9999px;
          box-shadow: 0 0 0 1px rgba(21, 24, 23, 0.52);
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-on-label"] {
          position: absolute;
          top: 27px;
          left: 452px;
          display: flex;
          min-width: 182px;
          height: 38px;
          align-items: center;
          padding: 0 15px;
          color: #081019;
          background-color: #eff8f8;
          border: 1px solid rgba(8, 16, 25, 0.2);
          border-radius: 6px;
          font-family: monospace;
          font-size: 17px;
          font-weight: 500;
          letter-spacing: 0.14em;
          line-height: 1;
          text-transform: uppercase;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-on-label"]::before {
          position: absolute;
          top: 18px;
          left: -39px;
          width: 31px;
          height: 1px;
          content: "";
          background-color: #34d6b4;
        }

        [class~="03-extension-on-stream"] {
          width: 100%;
          height: 242px;
          padding: 14px 18px 16px;
          color: #eff8f8;
          background-color: #1b1f1e;
          border-top: 1px solid rgba(239, 248, 248, 0.14);
        }

        [class~="03-extension-on-stream-header"] {
          display: flex;
          height: 22px;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 10px;
          color: #98abb8;
          font-family: monospace;
          font-size: 15px;
          font-weight: 500;
          letter-spacing: 0.12em;
          line-height: 1;
          text-transform: uppercase;
        }

        [class~="03-extension-on-status-stack"] {
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        [class~="03-extension-on-status-row"] {
          display: grid;
          width: 100%;
          height: 48px;
          grid-template-columns: 1fr auto;
          align-items: center;
          padding: 0 16px;
          color: #eff8f8;
          background-color: #202524;
          border: 1px solid rgba(239, 248, 248, 0.14);
          border-radius: 6px;
          font-family: monospace;
          font-size: 18px;
          font-weight: 500;
          letter-spacing: 0.08em;
          line-height: 1;
          text-transform: uppercase;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-status-rule"] {
          display: block;
          width: 52px;
          height: 1px;
          background-color: #98abb8;
        }

        [class~="03-extension-on-wordpress-window"] {
          position: relative;
          width: 100%;
          height: 592px;
          overflow: hidden;
          background-color: #eff8f8;
        }

        [class~="03-extension-on-wordpress-image"] {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          object-position: 50% 0%;
        }

        [class~="03-extension-on-focus-target"] {
          position: absolute;
          top: 19%;
          left: 24%;
          width: 66%;
          height: 42%;
          pointer-events: none;
        }

        [class~="03-extension-on-marker"] {
          position: absolute;
          z-index: 3;
          border-top: 1px solid rgba(8, 16, 25, 0.46);
          border-left: 1px solid rgba(8, 16, 25, 0.46);
          transform-origin: 0% 50%;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-marker"]::before {
          position: absolute;
          top: -25px;
          left: -1px;
          color: #081019;
          font-family: monospace;
          font-size: 14px;
          font-weight: 500;
          letter-spacing: 0.12em;
          line-height: 1;
          text-transform: uppercase;
        }

        [class~="03-extension-on-marker-heading"] {
          top: 22%;
          left: 25.6%;
          width: 42%;
          height: 10.5%;
        }

        [class~="03-extension-on-marker-heading"]::before {
          content: "Heading";
        }

        [class~="03-extension-on-marker-body"] {
          top: 35%;
          left: 25.6%;
          width: 64%;
          height: 23%;
        }

        [class~="03-extension-on-marker-body"]::before {
          content: "Body";
        }

        [class~="03-extension-on-operate-label"] {
          position: absolute;
          top: 52px;
          left: 844px;
          z-index: 3;
          display: flex;
          width: 996px;
          height: 64px;
          align-items: baseline;
          gap: 18px;
          overflow: hidden;
          color: #081019;
          font-family: serif;
          font-size: 54px;
          font-weight: 400;
          letter-spacing: -0.018em;
          line-height: 1.06;
        }

        [class~="03-extension-on-operate-word"] {
          display: inline-block;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-off-rule"] {
          position: absolute;
          top: 818px;
          left: 80px;
          z-index: 3;
          display: flex;
          width: 728px;
          height: 60px;
          align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          overflow: hidden;
          color: #081019;
          background-color: #eff8f8;
          border: 1px solid rgba(8, 16, 25, 0.2);
          border-radius: 8px;
          font-family: monospace;
          font-size: 22px;
          font-weight: 500;
          letter-spacing: 0.04em;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          will-change: transform, opacity;
        }

        [class~="03-extension-on-off-rule-line"] {
          position: absolute;
          top: 0;
          right: 0;
          left: 0;
          display: block;
          height: 1px;
          background-color: #081019;
          transform-origin: 0% 50%;
          will-change: transform;
        }

        [class~="03-extension-on-off-zero"] {
          font-family: serif;
          font-size: 42px;
          font-weight: 400;
          letter-spacing: -0.02em;
          line-height: 1;
        }
      </style>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

      <div
        id="root"
        data-composition-id="03-extension-on"
        data-width="1920"
        data-height="1080"
        data-duration="18.5"
      >
        <div
          id="03-extension-on-ground"
          class="clip 03-extension-on-ground"
          data-start="0"
          data-duration="18.5"
          data-track-index="0"
          aria-hidden="true"
        ></div>

        <div
          id="03-extension-on-shot"
          class="clip 03-extension-on-shot"
          data-start="0"
          data-duration="18.5"
          data-track-index="1"
        >
          <div id="03-extension-on-camera-outer" class="03-extension-on-camera-outer">
            <div
              id="03-extension-on-camera-inner"
              class="03-extension-on-camera-inner"
              data-layout-allow-overflow
            >
              <div id="03-extension-on-rail" class="03-extension-on-rail" aria-hidden="true"></div>

              <section
                id="03-extension-on-extension-surface"
                class="03-extension-on-panel 03-extension-on-panel-left"
                aria-label="Extension recording controls"
              >
                <div class="03-extension-on-chrome 03-extension-on-chrome-dark">
                  <span>Extension control</span>
                  <span class="03-extension-on-chrome-index">recording</span>
                </div>

                <div class="03-extension-on-extension-window" data-layout-allow-overflow>
                  <img
                    id="03-extension-on-extension-image"
                    class="03-extension-on-extension-image"
                    src="assets/screenshots/extension-recording.png"
                    alt=""
                  />
                  <div
                    id="03-extension-on-recording-ring"
                    class="03-extension-on-recording-ring"
                    aria-hidden="true"
                  ></div>
                  <div id="03-extension-on-on-label" class="03-extension-on-on-label">Explicit ON</div>
                </div>

                <div class="03-extension-on-stream">
                  <div class="03-extension-on-stream-header">
                    <span>Observation stream</span>
                    <span>3 channels</span>
                  </div>
                  <div class="03-extension-on-status-stack">
                    <div
                      id="03-extension-on-status-dom"
                      class="03-extension-on-status-row"
                    >
                      <span>DOM</span>
                      <span class="03-extension-on-status-rule" aria-hidden="true"></span>
                    </div>
                    <div
                      id="03-extension-on-status-screenshot"
                      class="03-extension-on-status-row"
                    >
                      <span>Screenshot</span>
                      <span class="03-extension-on-status-rule" aria-hidden="true"></span>
                    </div>
                    <div
                      id="03-extension-on-status-action"
                      class="03-extension-on-status-row"
                    >
                      <span>Action</span>
                      <span class="03-extension-on-status-rule" aria-hidden="true"></span>
                    </div>
                  </div>
                </div>
              </section>

              <section
                id="03-extension-on-wordpress-surface"
                class="03-extension-on-panel 03-extension-on-panel-right"
                aria-label="Observed WordPress page"
              >
                <div class="03-extension-on-chrome 03-extension-on-chrome-light">
                  <span>WordPress / Sample Page</span>
                  <span class="03-extension-on-chrome-index">observed</span>
                </div>

                <div class="03-extension-on-wordpress-window">
                  <img
                    id="03-extension-on-wordpress-image"
                    class="03-extension-on-wordpress-image"
                    src="assets/screenshots/wordpress-observed.png"
                    alt=""
                  />
                  <div
                    id="03-extension-on-focus-target"
                    class="03-extension-on-focus-target"
                    aria-hidden="true"
                  ></div>
                  <div
                    id="03-extension-on-marker-heading"
                    class="03-extension-on-marker 03-extension-on-marker-heading"
                    aria-hidden="true"
                  ></div>
                  <div
                    id="03-extension-on-marker-body"
                    class="03-extension-on-marker 03-extension-on-marker-body"
                    aria-hidden="true"
                  ></div>
                </div>
              </section>

              <div id="03-extension-on-operate-label" class="03-extension-on-operate-label">
                <span class="03-extension-on-operate-word" data-frame-role="operate-word">Operate</span>
                <span class="03-extension-on-operate-word" data-frame-role="operate-word">as</span>
                <span class="03-extension-on-operate-word" data-frame-role="operate-word">usual</span>
              </div>

              <div id="03-extension-on-off-rule" class="03-extension-on-off-rule">
                <span
                  id="03-extension-on-off-rule-line"
                  class="03-extension-on-off-rule-line"
                  aria-hidden="true"
                ></span>
                <span>OFF =</span>
                <span id="03-extension-on-off-zero" class="03-extension-on-off-zero">0</span>
                <span>observations</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};

        const root = document.querySelector('[data-composition-id="03-extension-on"]');
        const getFrameElement = (suffix) => document.getElementById(`03-extension-on-${suffix}`);

        const rail = getFrameElement("rail");
        const extensionSurface = getFrameElement("extension-surface");
        const wordpressSurface = getFrameElement("wordpress-surface");
        const recordingRing = getFrameElement("recording-ring");
        const onLabel = getFrameElement("on-label");
        const cameraOuter = getFrameElement("camera-outer");
        const cameraInner = getFrameElement("camera-inner");
        const focusTarget = getFrameElement("focus-target");
        const markerHeading = getFrameElement("marker-heading");
        const markerBody = getFrameElement("marker-body");
        const operateWords = Array.from(root.querySelectorAll('[data-frame-role="operate-word"]'));
        const offRule = getFrameElement("off-rule");
        const offRuleLine = getFrameElement("off-rule-line");

        // coordinate-target-zoom: measure once at setup, then bake the counter-shift.
        const cameraRect = cameraOuter.getBoundingClientRect();
        const targetRect = focusTarget.getBoundingClientRect();
        const hasMeasuredGeometry =
          cameraRect.width > 0 && cameraRect.height > 0 && targetRect.width > 0 && targetRect.height > 0;
        const targetOffsetX = hasMeasuredGeometry
          ? targetRect.left + targetRect.width / 2 - (cameraRect.left + cameraRect.width / 2)
          : 452;
        const targetOffsetY = hasMeasuredGeometry
          ? targetRect.top + targetRect.height / 2 - (cameraRect.top + cameraRect.height / 2)
          : -35;
        const desiredZoomScale = 1.18;
        const measuredScaleCap = hasMeasuredGeometry
          ? Math.min(
              (0.88 * cameraRect.width) / targetRect.width,
              (0.88 * cameraRect.height) / targetRect.height,
            )
          : desiredZoomScale;
        const zoomScale = Math.min(desiredZoomScale, measuredScaleCap);
        const counterX = -targetOffsetX;
        const counterY = -targetOffsetY;

        // dynamic-content-sequencing: content length determines each additive row's start.
        const statusItems = [
          { id: "status-dom", label: "DOM", hold: 0.22 },
          { id: "status-screenshot", label: "Screenshot", hold: 0.22 },
          { id: "status-action", label: "Action", hold: 0.65 },
        ];
        const statusBaseDuration = 0.42;
        const statusSecondsPerCharacter = 0.035;
        let statusElapsed = 0;
        const statusSequence = statusItems.map((item) => {
          const duration =
            statusBaseDuration + item.label.length * statusSecondsPerCharacter + item.hold;
          const entry = { ...item, start: statusElapsed, end: statusElapsed + duration };
          statusElapsed += duration;
          return entry;
        });

        const tl = gsap.timeline({ paused: true });

        // Scene 1 — the 42/58 split establishes from the frame edges and settles.
        tl.fromTo(
          rail,
          { opacity: 0.68, scale: 0.995 },
          { opacity: 1, scale: 1, duration: 0.72, ease: "power2.out" },
          0,
        );
        tl.fromTo(
          extensionSurface,
          { opacity: 0.55, x: -72 },
          { opacity: 1, x: -6, duration: 0.76, ease: "power3.out" },
          0.04,
        );
        tl.fromTo(
          wordpressSurface,
          { opacity: 0.55, x: 72 },
          { opacity: 1, x: 6, duration: 0.76, ease: "power3.out" },
          0.1,
        );
        tl.to(extensionSurface, { x: 0, duration: 0.28, ease: "power1.out" }, 0.8);
        tl.to(wordpressSurface, { x: 0, duration: 0.28, ease: "power1.out" }, 0.86);
        tl.fromTo(
          recordingRing,
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" },
          0.44,
        );
        tl.fromTo(
          onLabel,
          { opacity: 0, x: -18 },
          { opacity: 1, x: 0, duration: 0.48, ease: "power2.out" },
          0.72,
        );

        // Scene 2 — persistent surfaces, with one short off-center camera push.
        tl.fromTo(
          cameraOuter,
          { scale: 1 },
          { scale: zoomScale, duration: 1.32, ease: "power3.inOut" },
          4.24,
        );
        tl.fromTo(
          cameraInner,
          { x: 0, y: 0 },
          { x: counterX, y: counterY, duration: 1.32, ease: "power3.inOut" },
          4.24,
        );
        tl.fromTo(
          markerHeading,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.56, ease: "power2.out" },
          5.94,
        );
        tl.fromTo(
          markerBody,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.62, ease: "power2.out" },
          7.14,
        );
        tl.fromTo(
          cameraOuter,
          { scale: zoomScale },
          {
            scale: 1,
            duration: 1.06,
            ease: "power3.inOut",
            immediateRender: false,
          },
          8.64,
        );
        tl.fromTo(
          cameraInner,
          { x: counterX, y: counterY },
          {
            x: 0,
            y: 0,
            duration: 1.06,
            ease: "power3.inOut",
            immediateRender: false,
          },
          8.64,
        );

        // Scene 3 — the operation phrase and observation channels arrive across the beat.
        tl.fromTo(
          operateWords,
          { opacity: 0, y: 22 },
          {
            opacity: 1,
            y: 0,
            duration: 0.52,
            stagger: 0.13,
            ease: "power3.out",
          },
          9.9,
        );

        const statusPhaseStart = 10.56;
        statusSequence.forEach((entry) => {
          tl.fromTo(
            getFrameElement(entry.id),
            { opacity: 0, x: -24 },
            { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" },
            statusPhaseStart + entry.start,
          );
        });

        // Scene 4 — measured OFF rule lands, then every surface holds through 18s.
        tl.fromTo(
          offRule,
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.66, ease: "power3.out" },
          14.22,
        );
        tl.fromTo(
          offRuleLine,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.76, ease: "power2.out" },
          14.28,
        );

        window.__timelines["03-extension-on"] = tl;
      </script>
    </template>
  </body>
</html>
