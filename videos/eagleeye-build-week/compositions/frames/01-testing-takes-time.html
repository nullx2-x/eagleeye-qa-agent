        <div

        >

            class="01-testing-takes-time-flash"

      <script>
        window.__timelines = window.__timelines || {};

        const byId = (suffix) =>
          document.getElementById("01-testing-takes-time-" + suffix);

        const introWords = [byId("intro-web"), byId("intro-ja")];
        const processDeck = byId("process-deck");
        const processRow = byId("process-row");
        const finalLine = byId("final-line");
        const accentRule = byId("accent-rule");
        const flash = byId("flash");
        const dashboardShell = byId("dashboard-shell");

        const PROCESS_SEQUENCE = [
          { t: 2.8, state: byId("state-design"), number: byId("number-design") },
          { t: 4.05, state: byId("state-build"), number: byId("number-build") },
          { t: 5.3, state: byId("state-run"), number: byId("number-run") },
          { t: 6.55, state: byId("state-report"), number: byId("number-report") },
        ];

        const processStates = PROCESS_SEQUENCE.map((entry) => entry.state);
        const processNumbers = PROCESS_SEQUENCE.map((entry) => entry.number);
        const tl = gsap.timeline({ paused: true });

        tl.set(processStates, { opacity: 0, x: 0, scale: 1 }, 0);
        tl.set(processNumbers, { opacity: 0, y: 14 }, 0);
        tl.set([processRow, finalLine, flash], { opacity: 0 }, 0);
        tl.set(
          accentRule,
          {
            opacity: 1,
            x: 680,
            y: -200,
            scaleX: 0,
            transformOrigin: "0% 50%",
          },
          0,
        );

        const INTRO_ITEMS = [
          { element: introWords[0], text: "Web" },
          { element: introWords[1], text: "テストには" },
        ];
        const INTRO_BASE_DURATION = 0.34;
        const INTRO_SECONDS_PER_CHAR = 0.055;
        let introCursor = 0.1;
        const INTRO_WINDOWS = INTRO_ITEMS.map((entry) => {
          const start = introCursor;
          const contentDuration =
            INTRO_BASE_DURATION + entry.text.length * INTRO_SECONDS_PER_CHAR;
          introCursor += contentDuration;
          return { ...entry, start, end: introCursor };
        });

        INTRO_WINDOWS.forEach((entry) => {
          tl.fromTo(
            entry.element,
            { opacity: 0, y: 34, filter: "blur(10px)" },
            {
              opacity: 1,
              y: 0,
              filter: "blur(0px)",
              duration: 0.5,
              ease: "power3.out",
            },
            entry.start,
          );
        });

        tl.fromTo(
          accentRule,
          { scaleX: 0 },
          { scaleX: 0.3, duration: 0.42, ease: "power3.out" },
          0.92,
        );

        introWords.forEach((word, index) => {
          const exitAt = 2.58 + index * 0.022;
          tl.to(
            word,
            { x: -230, duration: 0.34, ease: "power4.in" },
            exitAt,
          );
          tl.to(
            word,
            { opacity: 0, duration: 0.18, ease: "power1.in" },
            exitAt,
          );
        });
        tl.to(
          accentRule,
          { opacity: 0, duration: 0.18, ease: "power1.in" },
          2.58,
        );

        PROCESS_SEQUENCE.forEach((entry, index) => {
          tl.set(processStates, { opacity: 0 }, entry.t);
          tl.set(processNumbers, { opacity: 0, y: 14 }, entry.t);
          tl.set(entry.state, { opacity: 1, x: 0, scale: 1 }, entry.t);

          if (index === 0) {
            tl.fromTo(
              entry.state,
              { opacity: 0.35, x: 230 },
              {
                opacity: 1,
                x: 0,
                duration: 0.34,
                ease: "power4.out",
                immediateRender: false,
              },
              entry.t,
            );
          } else {
            tl.fromTo(
              flash,
              { opacity: 0 },
              {
                opacity: 0.34,
                duration: 0.045,
                ease: "none",
                immediateRender: false,
              },
              entry.t - 0.01,
            );
            tl.to(
              flash,
              { opacity: 0, duration: 0.075, ease: "none" },
              entry.t + 0.035,
            );
          }

          tl.fromTo(
            entry.number,
            { opacity: 0, y: 14 },
            {
              opacity: 1,
              y: 0,
              duration: 0.26,
              ease: "power3.out",
              immediateRender: false,
            },
            entry.t + 0.18,
          );
        });

        tl.to(
          processDeck,
          {
            scale: 0.74,
            opacity: 0,
            duration: 0.4,
            ease: "power2.in",
          },
          7.62,
        );

        tl.fromTo(
          dashboardShell,
          { scale: 0.74, opacity: 0, y: 90 },
          {
            scale: 1,
            opacity: 1,
            y: 0,
            duration: 0.68,
            ease: "back.out(1.4)",
            immediateRender: false,
          },
          7.8,
        );

        tl.fromTo(
          processRow,
          { opacity: 0, y: 18 },
          {
            opacity: 1,
            y: 0,
            duration: 0.4,
            ease: "power3.out",
            immediateRender: false,
          },
          8.73,
        );

        tl.to(
          dashboardShell,
          {
            scale: 0.8,
            filter: "blur(20px)",
            duration: 0.25,
            ease: "power3.in",
          },
          9.95,
        );
        tl.to(
          dashboardShell,
          { opacity: 0.15, duration: 0.25, ease: "none" },
          9.95,
        );
        tl.to(
          processRow,
          {
            scale: 0.8,
            filter: "blur(10px)",
            duration: 0.25,
            ease: "power3.in",
          },
          9.95,
        );
        tl.to(
          processRow,
          { opacity: 0.15, duration: 0.25, ease: "none" },
          9.95,
        );
        tl.set([dashboardShell, processRow], { opacity: 0 }, 10.2);

        tl.fromTo(
          finalLine,
          {
            opacity: 0.15,
            scale: 1.25,
            filter: "blur(10px)",
          },
          {
            opacity: 1,
            scale: 1,
            filter: "blur(0px)",
            duration: 0.5,
            ease: "expo.out",
            immediateRender: false,
          },
          10.2,
        );

        tl.set(
          accentRule,
          {
            opacity: 1,
            x: 0,
            y: 0,
            scaleX: 0,
            transformOrigin: "0% 50%",
          },
          10.2,
        );
        tl.to(
          accentRule,
          { scaleX: 1, duration: 0.52, ease: "power3.out" },
          10.28,
        );

        window.__timelines["01-testing-takes-time"] = tl;
      </script>
    </template>
