      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (() => {
          const frameId = "06-replay-run";
          const byId = (suffix) => document.getElementById(frameId + "-" + suffix);

          window.__timelines = window.__timelines || {};
          const tl = gsap.timeline({ paused: true });

          const world = byId("world");
          const replaySurface = byId("replay-surface");
          const replayHit = byId("replay-hit");
          const pointer = byId("pointer");
          const runner = byId("runner");
          const wordpressCard = byId("wordpress-card");
          const wordpressImageWrap = byId("wordpress-image-wrap");
          const headingMarker = byId("heading-marker");
          const headingLabel = byId("heading-label");

          tl.addLabel("scene-1", 0);
          tl.addLabel("scene-2", 4.8);
          tl.addLabel("scene-3", 10);
          tl.addLabel("scene-4", 15.6);

          tl.fromTo(
            replaySurface,
            { opacity: 0.42, y: 24, scale: 0.985 },
            {
              opacity: 1,
              y: 0,
              scale: 1,
              duration: 0.8,
              ease: "power3.out",
              immediateRender: true,
            },
            0,
          );

          tl.fromTo(
            pointer,
            { opacity: 0, x: 1510, y: 760, scale: 0.92 },
            {
              opacity: 1,
              x: 1450,
              y: 735,
              scale: 1,
              duration: 0.42,
              ease: "power3.out",
              immediateRender: true,
            },
            0.05,
          );

          tl.to(
            pointer,
            {
              x: 573,
              y: 565,
              duration: 1.65,
              ease: "power3.inOut",
            },
            1.35,
          );

          tl.fromTo(
            replayHit,
            { opacity: 0, scale: 0.96 },
            {
              opacity: 1,
              scale: 1,
              duration: 0.38,
              ease: "power3.out",
              immediateRender: true,
            },
            2.78,
          );

          tl.fromTo(
            [pointer, replayHit],
            { scale: 1 },
            {
              scale: 0.92,
              duration: 0.11,
              ease: "power1.in",
              immediateRender: false,
            },
            3.45,
          );
          tl.to(
            [pointer, replayHit],
            {
              scale: 1,
              duration: 0.38,
              ease: "back.out(1.6)",
            },
            3.56,
          );
          tl.to(
            replayHit,
            {
              backgroundColor: "rgba(52, 214, 180, 0.22)",
              duration: 0.11,
              ease: "power1.in",
            },
            3.45,
          );
          tl.to(
            replayHit,
            {
              backgroundColor: "rgba(52, 214, 180, 0.08)",
              duration: 0.34,
              ease: "power2.out",
            },
            3.56,
          );

          ["ripple-1", "ripple-2", "ripple-3"].forEach((suffix, index) => {
            const ring = byId(suffix);
            const start = 3.47 + index * 0.09;
            tl.fromTo(
              ring,
              { opacity: 0, scale: 0 },
              {
                opacity: 0.72,
                scale: 0.28,
                duration: 0.06,
                ease: "power2.out",
                immediateRender: true,
              },
              start,
            );
            tl.to(
              ring,
              {
                opacity: 0,
                scale: 4.2,
                duration: 0.68,
                ease: "power3.out",
              },
              start + 0.04,
            );
          });

          tl.fromTo(
            runner,
            { opacity: 0, x: 76, scale: 0.97 },
            {
              opacity: 1,
              x: 0,
              scale: 1,
              duration: 0.68,
              ease: "power3.out",
              immediateRender: true,
            },
            4.82,
          );

          const stepDefs = [
            {
              step: "step-1",
              mark: "step-mark-1",
              text: "goto",
              hold: 0.18,
              cursorY: 318,
              cameraX: -22,
              cameraY: 34,
              cameraScale: 1.02,
            },
            {
              step: "step-2",
              mark: "step-mark-2",
              text: "click",
              hold: 0.18,
              cursorY: 402,
              cameraX: -28,
              cameraY: 18,
              cameraScale: 1.025,
            },
            {
              step: "step-3",
              mark: "step-mark-3",
              text: "assert URL",
              hold: 0.18,
              cursorY: 486,
              cameraX: -34,
              cameraY: 2,
              cameraScale: 1.03,
            },
            {
              step: "step-4",
              mark: "step-mark-4",
              text: "assert title",
              hold: 0.18,
              cursorY: 570,
              cameraX: -40,
              cameraY: -14,
              cameraScale: 1.035,
            },
            {
              step: "step-5",
              mark: "step-mark-5",
              text: "assert heading",
              hold: 0.38,
              cursorY: 654,
              cameraX: -46,
              cameraY: -30,
              cameraScale: 1.04,
            },
          ];

          const baseDuration = 0.38;
          const secondsPerCharacter = 0.025;
          let cumulative = 0;
          const sequence = stepDefs.map((item) => {
            const speedFactor = 1;
            const duration =
              (baseDuration + item.text.length * secondsPerCharacter) / speedFactor + item.hold;
            const start = 5.25 + cumulative;
            cumulative += duration;
            return { item, start, duration };
          });

          sequence.forEach((entry) => {
            const step = byId(entry.item.step);
            const mark = byId(entry.item.mark);

            tl.fromTo(
              step,
              { opacity: 0, x: 26, scale: 0.985 },
              {
                opacity: 1,
                x: 0,
                scale: 1,
                duration: 0.4,
                ease: "power3.out",
                immediateRender: true,
              },
              entry.start,
            );

            tl.fromTo(
              mark,
              { opacity: 0, scale: 0.42 },
              {
                opacity: 1,
                scale: 1,
                duration: 0.34,
                ease: "back.out(1.35)",
                immediateRender: true,
              },
              entry.start + 0.16,
            );

            tl.to(
              pointer,
              {
                x: 1018,
                y: entry.item.cursorY,
                duration: 0.44,
                ease: "power3.inOut",
              },
              entry.start - 0.18,
            );

            tl.to(
              world,
              {
                x: entry.item.cameraX,
                y: entry.item.cameraY,
                scale: entry.item.cameraScale,
                duration: 0.52,
                ease: "power2.inOut",
              },
              entry.start - 0.14,
            );
          });

          tl.to(
            world,
            {
              x: 0,
              y: 0,
              scale: 1,
              duration: 0.85,
              ease: "power3.inOut",
            },
            10,
          );
