          const one = (name) => elements[name];
          const all = (name) => groups[name];

          const timeline = gsap.timeline({ paused: true });

          timeline.fromTo(
            one("background-image"),
            { scale: 1.035 },
            { scale: 1, duration: 12.2, ease: "none" },

            one("header-rule"),
            { scaleX: 0, opacity: 0 },
            { scaleX: 1, opacity: 1, duration: 0.86, ease: "power2.out" },
            0.48,
          );

          const cards = all("context-card");
          const cardStarts = [
            { x: 120, y: 54 },
            { x: 0, y: 58 },
            { x: -120, y: 54 },
          ];

          cards.forEach((card, index) => {
            timeline.fromTo(
              card,
              {
                x: cardStarts[index].x,
                y: cardStarts[index].y,
                scale: 0.9,
                opacity: 0,
              },
              {
                x: 0,
                y: 0,
                scale: 1,
                opacity: 1,
                duration: 1.1,
                ease: "power3.out",
              },
              3.72 + index * 0.08,
            );
          });

          const sublineTimes = [5.25, 6.65, 8.05];
          all("card-subline").forEach((subline, index) => {
            timeline.fromTo(
              subline,
              { y: 16, opacity: 0 },
              { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
              sublineTimes[index],
            );
          });

          timeline.fromTo(
            one("session-outgoing"),
            { scale: 0.92, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
            9.62,
          );

          all("wire-stroke").forEach((wire, index) => {
            timeline.fromTo(
              wire,
              { scaleX: 0, opacity: 0 },
              { scaleX: 1, opacity: 1, duration: 0.52, ease: "power2.out" },
              9.62 + index * 0.06,
            );
          });

          timeline.fromTo(
            one("stem-stroke"),
            { scaleY: 0, opacity: 0 },
            { scaleY: 1, opacity: 1, duration: 0.28, ease: "power2.out" },

            { scale: 1, opacity: 1, duration: 0.25, ease: "power2.out" },
            10.08,

            10.28,

            one("session-incoming"),
            { scale: 0.72, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
            10.48,

            { y: 0, opacity: 1, duration: 0.68, ease: "power3.out" },
