name: Operational QA formatter

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: operational-qa-formatter-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  format-test-and-commit:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'upgrade/operational-qa-hardening'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out writable branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Apply canonical formatting and safe fixes
        run: |
          uv run ruff format app scripts tests
          uv run ruff check app scripts tests --fix || true
          uv run ruff format --check app scripts tests

      - name: Compile Python sources
        run: uv run python -m compileall -q app scripts tests

      - name: Run regression tests
        run: uv run pytest -q

      - name: Verify clean operational tree
        shell: bash
        run: |
          test ! -e reports
          test ! -e videos/eagleeye-build-week
          test ! -e docs/build-week
          test ! -e app/browser_hardening.py
          test ! -e scripts/apply_operational_upgrade.py
          ! git grep -n -i 'create_wordpress_demo\|demo/wordpress\|page_id=2\|EagleEye WP Lab\|extension-wordpress' -- .
          git diff --check

      - name: Commit formatted and tested changes
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No formatting changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'style: normalize operational QA upgrade [format-sync]'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Capture remaining lint findings
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run ruff check app scripts tests 2>&1 | tee "${RUNNER_TEMP}/ruff.log"

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: operational-qa-lint-${{ github.run_id }}
          path: ${{ runner.temp }}/ruff.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce lint gate
        if: always()
        run: test "${{ steps.lint.outcome }}" = "success"
