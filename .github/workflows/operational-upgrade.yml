name: Operational QA verification

on:
  push:
    branches:
      - main
      - upgrade/operational-qa-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: operational-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Compile Python sources
        run: uv run python -m compileall -q app scripts tests

      - name: Check formatting and lint
        run: |
          uv run ruff format --check app scripts tests
          uv run ruff check app scripts tests

      - name: Run regression tests
        run: uv run pytest -q

      - name: Verify clean operational tree
        shell: bash
        run: |
          test ! -e reports
          test ! -e videos/eagleeye-build-week
          test ! -e docs/build-week
          test ! -e app/browser_hardening.py
          test ! -e scripts/apply_operational_upgrade.py
          ! git grep -n -i 'create_wordpress_demo\|demo/wordpress\|page_id=2\|EagleEye WP Lab\|extension-wordpress' -- .
          git diff --check
