name: Operational QA upgrade

on:
  push:
    branches:
      - upgrade/operational-qa-hardening
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: operational-qa-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'upgrade/operational-qa-hardening') ||
        (github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[operational-sync]'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out writable branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true

      - name: Apply deterministic migration
        run: python scripts/apply_operational_upgrade.py

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Apply formatter and safe lint fixes
        run: |
          uv run ruff format app scripts tests
          uv run ruff check app scripts tests --fix || true

      - name: Compile Python sources
        run: uv run python -m compileall -q app scripts tests

      - name: Run regression tests
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee "${RUNNER_TEMP}/pytest.log"

      - name: Verify removed history and legacy routes
        id: safety
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test ! -e reports
            test ! -e videos/eagleeye-build-week
            test ! -e docs/build-week
            ! git grep -n -i 'create_wordpress_demo\|demo/wordpress\|page_id=2' -- . ':!scripts/apply_operational_upgrade.py'
            git diff --check
          } 2>&1 | tee "${RUNNER_TEMP}/safety.log"

      - name: Commit migrated workspace
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No migration changes to commit.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: apply operational QA upgrade [operational-sync]'
            git push origin HEAD:${TARGET_BRANCH}
          fi

      - name: Enforce final formatting and lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            uv run ruff format --check app scripts tests
            uv run ruff check app scripts tests
          } 2>&1 | tee "${RUNNER_TEMP}/ruff.log"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-upgrade-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/safety.log
            ${{ runner.temp }}/ruff.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce final gate
        if: always()
        shell: bash
        run: |
          test "${{ steps.pytest.outcome }}" = "success"
          test "${{ steps.safety.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
