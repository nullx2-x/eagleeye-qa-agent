name: EagleEye Verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: eagleeye-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify change
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out pull request head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Run independent verification
        id: verification
        shell: bash
        env:
          EAGLEEYE_PROJECT_ROOTS: ${{ github.workspace }}
        run: |
          set +e
          uv run python scripts/run_verification.py \
            --project-root "${GITHUB_WORKSPACE}" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --service-type ai_agent
          code=$?
          echo "exit_code=${code}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Preserve verification manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eagleeye-verification-${{ github.event.pull_request.number }}
          path: artifacts/verifications/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce verification verdict
        if: ${{ always() }}
        shell: bash
        run: exit "${{ steps.verification.outputs.exit_code || '30' }}"
