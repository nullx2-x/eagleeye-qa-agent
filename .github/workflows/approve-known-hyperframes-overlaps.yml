name: Approve known HyperFrames overlaps

on:
  push:
    branches:
      - agent/refresh-dependencies

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/refresh-dependencies
          fetch-depth: 0

      - name: Mark intentional overlaps
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path("videos/eagleeye-build-week/compositions/frames/02-introducing-eagleeye.html"): [
                  (
                      'id="02-introducing-eagleeye-wordmark"\n                class="02-introducing-eagleeye-wordmark"',
                      'id="02-introducing-eagleeye-wordmark"\n                class="02-introducing-eagleeye-wordmark"\n                data-layout-allow-overlap',
                  ),
                  (
                      '<div class="02-introducing-eagleeye-morph-old-mark">EagleEye</div>',
                      '<div class="02-introducing-eagleeye-morph-old-mark" data-layout-allow-overlap>EagleEye</div>',
                  ),
              ],
              Path("videos/eagleeye-build-week/compositions/frames/09-shareable-report.html"): [
                  (
                      '<h1 id="09-shareable-report-title">One shareable report</h1>',
                      '<h1 id="09-shareable-report-title" data-layout-allow-overlap>One shareable report</h1>',
                  ),
                  (
                      'id="09-shareable-report-replay-marker"\n                      data-f09-role="surface-marker"',
                      'id="09-shareable-report-replay-marker"\n                      data-f09-role="surface-marker"\n                      data-layout-allow-overlap',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {path}: {old}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install locked demo dependencies
        working-directory: videos/eagleeye-build-week
        run: npm ci

      - name: Verify HyperFrames project
        working-directory: videos/eagleeye-build-week
        run: npm run check

      - name: Commit verified overlap annotations
        shell: bash
        run: |
          set -euo pipefail
          git add \
            videos/eagleeye-build-week/compositions/frames/02-introducing-eagleeye.html \
            videos/eagleeye-build-week/compositions/frames/09-shareable-report.html
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: annotate intentional HyperFrames overlaps"
          git push origin HEAD:agent/refresh-dependencies
