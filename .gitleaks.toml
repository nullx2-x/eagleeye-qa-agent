[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Chrome manifest key is an SPKI public key used only for a stable extension ID."
    condition = "AND"
    regexTarget = "line"
    regexes = ['''^\s*"key":\s*"MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A''']
    paths = ['''(^|/)chrome-extension/manifest\.json$''']
