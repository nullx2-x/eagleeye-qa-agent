[project]
name = "eagleeye-qa-agent"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.139.2,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26",
    "mcp[cli]>=2.1.1,<3",
    "playwright>=1.50,<2",
    "pydantic>=2.13.4,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.51,<0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16,<0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
